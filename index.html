<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Is Everywhere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#faf7f2;font-family:Georgia,serif;display:flex;flex-direction:column}
.header{text-align:center;padding:2.5rem 1.5rem 1.5rem;border-bottom:1px solid #f0e8d8}
.byline{font-size:11px;letter-spacing:.15em;color:#a8916a;margin-bottom:10px;text-transform:uppercase}
h1{font-size:28px;font-weight:normal;color:#2c1f0e;margin:0 0 6px}
.sub{font-size:14px;color:#8a7560;font-style:italic}
.topics{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:1.25rem 1.5rem .5rem;max-width:640px;margin:0 auto;width:100%}
.tb{font-size:13px;padding:6px 16px;border:1px solid #a8916a;border-radius:20px;background:transparent;color:#6b4f2e;cursor:pointer;font-family:Georgia,serif}
.tb:hover{background:#e8dcc8}
.messages{flex:1;padding:1.5rem;max-width:640px;width:100%;margin:0 auto}
.empty{text-align:center;padding:3rem 1rem;color:#8a7560;font-size:15px;line-height:1.8;font-style:italic}
.attr{margin-top:12px;font-size:12px;color:#a8916a;font-style:normal}
.mu{display:flex;justify-content:flex-end;margin-bottom:20px}
.mub{background:#f0e8d8;border:1px solid #ddd0b8;border-radius:16px 16px 4px 16px;padding:10px 16px;max-width:78%;font-size:15px;color:#2c1f0e;line-height:1.6}
.mr{margin-bottom:24px}
.rl{font-size:10px;letter-spacing:.12em;color:#a8916a;text-transform:uppercase;margin-bottom:10px}
.rb{background:#fff;border:1px solid #f0e8d8;border-left:3px solid #a8916a;border-radius:12px;padding:1.25rem 1.5rem}
.rb p{font-size:16px;color:#2c1f0e;line-height:1.8}
.rb p+p{margin-top:14px}
.me{margin-bottom:20px;padding:10px 14px;background:#fff8f0;border:1px solid #e0c8a0;border-radius:10px;font-size:13px;color:#8a5a2a}
.dots{display:flex;gap:6px;padding:1rem 1.5rem;background:#fff;border:1px solid #f0e8d8;border-left:3px solid #a8916a;border-radius:12px;width:fit-content}
.dot{width:7px;height:7px;border-radius:50%;background:#a8916a;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
.ia{padding:1.25rem 1.5rem 2rem;max-width:640px;width:100%;margin:0 auto}
.ir{display:flex;gap:8px}
.ir input{flex:1;font-size:15px;padding:10px 16px;border:1px solid #d4c4a8;border-radius:24px;background:#fff;color:#2c1f0e;font-family:Georgia,serif;outline:none}
.ir input::placeholder{color:#b5a08a}
.ir button{font-size:14px;padding:10px 20px;border:1px solid #a8916a;border-radius:24px;background:#6b4f2e;color:#fff;cursor:pointer;font-family:Georgia,serif}
.ir button:disabled{opacity:.5;cursor:default}
.fn{text-align:center;margin-top:12px;font-size:11px;color:#a8916a}
</style>
</head>
<body>
<div class="header">
<div class="byline">Ray Main · Springdale, Arkansas</div>
<h1>God Is Everywhere</h1>
<p class="sub">If you have the eyes to see</p>
</div>
<div class="topics">
<button class="tb" onclick="ask('I feel like God has forgotten about me')">Feeling forgotten</button>
<button class="tb" onclick="ask('I used to believe but I\'m not sure anymore')">Losing faith</button>
<button class="tb" onclick="ask('I got hurt by people in the church and I haven\'t gone back')">Church hurt</button>
<button class="tb" onclick="ask('I\'ve been waiting and praying but nothing is changing')">The waiting</button>
<button class="tb" onclick="ask('I can\'t hear God at all right now')">Silence</button>
<button class="tb" onclick="ask('I feel like I\'m too far gone to come back')">Too far gone</button>
</div>
<div class="messages" id="msgs">
<div class="empty" id="empty">"I don't know what brought you here.<br>Whatever it is — I'm glad you're here."<div class="attr">— Ray</div></div>
</div>
<div class="ia">
<div class="ir">
<input type="text" id="inp" placeholder="Tell me what you're carrying...">
<button id="btn" onclick="send()">Send</button>
</div>
<div class="fn">Rooted in <em>God Is Everywhere — If You Have the Eyes to See</em></div>
</div>
<script>
const SYS=`You are a faith companion built on the voice and stories of Ray Main — a 77-year-old pastor, beekeeper, and builder from Springdale, Arkansas. Speak as Ray writes: unhurried, honest, warm, direct, never preachy. Use plain language and the natural world to explain the spiritual — bees, gardens, seeds, deer, calves, sunrise sky. Core theology: God is present in places most people aren't looking. He sees you. He knows where you are. If you can't hear Him that doesn't mean He isn't working. Just wait. The church is a spiritual hospital — people get hurt by people inside it, not by God. Key stories: The doe in the woods — Ray asked "are you even real?" and a doe walked up to three feet away and wouldn't leave. Pop's last words — "Just wait." The Tyson crew — every man had church hurt. The bees — 60,000 doing what they were made to do. The seed — looks like death going in, comes up bent, straightens toward light. The calf's first bawl — life insisting on itself. Jeannette — "I am ready." Three syllables. Fifty-eight years. Audience: 20-35 year olds. No platitudes. 3-5 short paragraphs. Never start with I. Never list. End with one honest sentence.`;
let busy=false;
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!busy)send();});
async function ask(q){
if(busy)return;
document.getElementById('inp').value='';
const em=document.getElementById('empty');
if(em)em.remove();
addU(q);showL();busy=true;
document.getElementById('btn').disabled=true;
try{
const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYS,messages:[{role:'user',content:q}]})});
removeL();
if(!r.ok)throw new Error(r.status);
const d=await r.json();
const t=d.content?.[0]?.text||'';
if(t)addR(t);else addE('Empty response. Try again.');
}catch(e){removeL();addE('Having trouble connecting. Try again in a moment.');}
finally{busy=false;document.getElementById('btn').disabled=false;}
}
function send(){const v=document.getElementById('inp').value.trim();if(v)ask(v);}
function addU(t){const m=document.getElementById('msgs');const d=document.createElement('div');d.className='mu';d.innerHTML=`<div class="mub">${t}</div>`;m.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});}
function addR(t){const m=document.getElementById('msgs');const d=document.createElement('div');d.className='mr';const p=t.split(/\n\n+/).filter(x=>x.trim()).map(x=>`<p>${x.trim()}</p>`).join('');d.innerHTML=`<div class="rl">Ray</div><div class="rb">${p}</div>`;m.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});}
function addE(t){const m=document.getElementById('msgs');const d=document.createElement('div');d.className='me';d.textContent=t;m.appendChild(d);}
function showL(){const m=document.getElementById('msgs');const d=document.createElement('div');d.className='mr';d.id='ld';d.innerHTML=`<div class="rl">Ray</div><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;m.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});}
function removeL(){const e=document.getElementById('ld');if(e)e.remove();}
</script>
</body>
</html>
